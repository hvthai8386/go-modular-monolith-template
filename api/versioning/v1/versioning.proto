syntax = "proto3";

package versioning.v1;

import "google/api/annotations.proto";

option go_package = "github.com/your-org/go-hexagon-template/gen/versioning/v1;versioningv1";

service VersioningService {
  rpc GetVersion(GetVersionRequest) returns (GetVersionResponse) {
    option (google.api.http) = {get: "/v1/versioning/version"};
  }
}

message GetVersionRequest {}

message GetVersionResponse {
  string app_version = 1;
  string go_version = 2;
  string database_version = 3;
  int64 schema_version = 4;
}
